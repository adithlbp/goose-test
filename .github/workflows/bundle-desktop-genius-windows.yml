name: "Bundle Desktop — Genius (Windows)"

# Build corporativo de Genius Assistant para Windows (ZIP portable, como upstream).
#
# IMPORTANTE: esto SOLO corre en un runner Windows (windows-latest). El binario
# goose.exe se compila con cargo + MSVC (x86_64-pc-windows-msvc), que no existe
# en macOS — por eso no hay receta local equivalente a build_corporate.sh.
#
# En Windows NO se congela el binario (a diferencia de I5 en macOS): Credential
# Manager es por-usuario y no ata ACL al hash, así que goose.exe se recompila sin
# problema de re-prompts.
#
# La política corporativa (provider fijo, locks, seguridad, marca) se hornea
# sourceando installer/corporate_env.sh — MISMA fuente que el build de macOS.

on:
  workflow_dispatch:
    inputs:
      signing:
        description: 'Firmar los .exe con Azure Trusted Signing (requiere secrets corporativos)'
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  build-desktop-windows:
    name: Build Genius Desktop (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 24.10.0

      - name: Install pnpm
        run: npm install -g pnpm@10.30.3

      - name: Setup Rust
        shell: bash
        run: |
          rustup show
          rustup target add x86_64-pc-windows-msvc

      - name: Build Windows executable
        shell: pwsh
        run: |
          Write-Output "Building Windows ACP backend"
          cargo build --release --target x86_64-pc-windows-msvc -p goose-cli --bin goose
          $binaryPath = "./target/x86_64-pc-windows-msvc/release/goose.exe"
          if (-not (Test-Path $binaryPath)) {
            Write-Error "Windows backend binary not found: $binaryPath"
            exit 1
          }
          Write-Output "Windows backend binary found."
          Get-Item $binaryPath

      - name: Prepare Windows binary
        shell: bash
        run: |
          BACKEND_BINARY="./target/x86_64-pc-windows-msvc/release/goose.exe"
          rm -rf ./ui/desktop/src/bin
          mkdir -p ./ui/desktop/src/bin
          cp -f "$BACKEND_BINARY" ./ui/desktop/src/bin/

          if [ -d "./ui/desktop/src/platform/windows/bin" ]; then
            for file in ./ui/desktop/src/platform/windows/bin/*.{exe,dll,cmd}; do
              filename="$(basename "$file")"
              if [ -f "$file" ] && [ "$filename" != "goose.exe" ]; then
                cp -f "$file" ./ui/desktop/src/bin/
              fi
            done
            if [ -d "./ui/desktop/src/platform/windows/bin/goose-npm" ]; then
              cp -r ./ui/desktop/src/platform/windows/bin/goose-npm/ ./ui/desktop/src/bin/goose-npm/
            fi
          fi

      - name: Force GitHub HTTPS for npm git dependencies
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "git+ssh://git@github.com/"

      - name: Build desktop UI (política corporativa horneada)
        shell: bash
        env:
          ELECTRON_PLATFORM: win32
        run: |
          # Fuente ÚNICA de la política corporativa (compartida con macOS).
          # Debe sourcearse en el MISMO step que 'make': vite lee process.env
          # en build-time para hornear las variables en el bundle.
          . installer/corporate_env.sh

          cd ui/desktop
          pnpm install --frozen-lockfile
          node scripts/build-main.js
          node scripts/prepare-platform-binaries.js
          pnpm run make --platform=win32 --arch=x64

      - name: Prepare flat distribution
        shell: bash
        run: |
          cd ui/desktop
          APP_DIR="out/Genius Assistant-win32-x64"
          mkdir -p "$APP_DIR/resources/bin"
          cp -r src/bin/* "$APP_DIR/resources/bin/"

          rm -rf ./dist-windows
          mkdir -p ./dist-windows
          cp -r "$APP_DIR"/* ./dist-windows/

          echo "Distribución plana:"
          ls -la ./dist-windows/
          echo "Binarios en resources/bin:"
          ls -la ./dist-windows/resources/bin/

      - name: Create distributable ZIP (contenido en la raíz)
        if: ${{ !inputs.signing }}
        shell: bash
        run: |
          # El ZIP debe tener 'Genius Assistant.exe' + 'resources/' en la RAÍZ:
          # install_genius.ps1 busca resources\bin\goose.exe tras Expand-Archive.
          cd ui/desktop/dist-windows
          7z a -tzip "$GITHUB_WORKSPACE/GeniusAssistant-win32-x64.zip" .

      - name: Upload unsigned ZIP (listo para GENIUS_DESKTOP_URL)
        if: ${{ !inputs.signing }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: GeniusAssistant-win32-x64
          path: GeniusAssistant-win32-x64.zip

      - name: Upload distribution for signing
        if: ${{ inputs.signing }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: genius-windows-unsigned
          path: ui/desktop/dist-windows/

  sign-desktop-windows:
    name: Sign Genius Desktop (Windows)
    needs: build-desktop-windows
    if: ${{ inputs.signing }}
    runs-on: windows-latest
    environment: signing

    steps:
      - name: Download unsigned distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: genius-windows-unsigned
          path: dist-windows

      - name: Azure login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows executables with Azure Trusted Signing
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files: |
            ${{ github.workspace }}/dist-windows/Genius Assistant.exe
            ${{ github.workspace }}/dist-windows/resources/bin/goose.exe

      - name: Verify signed executables
        shell: pwsh
        run: |
          $files = @(
            "dist-windows/Genius Assistant.exe",
            "dist-windows/resources/bin/goose.exe"
          )
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne "Valid") { throw "Signature invalid for ${file}: $($sig.Status)" }
            Write-Output "Signature valid: $file"
          }

      - name: Create Windows zip package (contenido en la raíz)
        shell: bash
        run: |
          cd dist-windows
          7z a -tzip "$GITHUB_WORKSPACE/GeniusAssistant-win32-x64.zip" .

      - name: Upload signed Windows build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: GeniusAssistant-win32-x64-signed
          path: GeniusAssistant-win32-x64.zip
